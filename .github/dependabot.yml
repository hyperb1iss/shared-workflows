# 🤖 Dependabot — shared-workflows
# This repo is the single place 15+ consumers resolve their action
# versions from, so drift here is drift everywhere at once.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(actions)'
    groups:
      actions:
        patterns:
          - '*'
