# 🏷️ Rust Release — shared-workflows
# Version bump → tag → trigger downstream CI/CD.
# Each consuming repo keeps a thin release.yml with workflow_dispatch inputs
# that calls this shared workflow via workflow_call.

name: Rust Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Explicit version (e.g., 0.2.0) — overrides bump'
        type: string
        default: ''
      bump:
        description: 'Version bump type (patch/minor/major)'
        type: string
        default: 'patch'
      dry_run:
        description: 'Build + test only, skip publish'
        type: boolean
        default: false
      system-deps:
        description: 'apt packages for build/test'
        type: string
        default: ''
      workspace:
        description: 'Workspace mode'
        type: boolean
        default: false
      workspace-crates:
        description: 'Space-separated crate names for workspace version patching'
        type: string
        default: ''
      all-features:
        description: '--all-features for build/test/clippy'
        type: boolean
        default: true
      nextest:
        description: 'Use nextest for release validation'
        type: boolean
        default: true
      generate-release-notes:
        description: 'Generate + upload release notes artifact'
        type: boolean
        default: false
      generate-changelog:
        description: 'Update CHANGELOG.md via git-iris'
        type: boolean
        default: false
      release-notes-model:
        description: 'AI model for git-iris release notes and changelog'
        type: string
        default: 'claude-opus-5'
      release-notes-provider:
        description: 'LLM provider for git-iris'
        type: string
        default: 'anthropic'
      cicd-workflow:
        description: 'Downstream workflow to trigger'
        type: string
        default: 'cicd.yml'
      pass-run-id:
        description: 'Pass release_run_id to downstream'
        type: boolean
        default: false
      patch-workspace-dep-versions:
        description: 'Also patch version pins for path deps in root Cargo.toml'
        type: boolean
        default: false
      version-files:
        description: >-
          Newline-separated list of extra files to patch with the new version.
          Supports JSON (.json) and YAML frontmatter (.md, .yml, .yaml).
          JSON files patch the top-level "version" field (or nested via jq path).
          YAML frontmatter patches the "version:" field in --- blocks.
          Format: one file path per line, optionally followed by a jq expression
          for JSON (e.g., ".claude-plugin/marketplace.json|.plugins[0].version").
        type: string
        default: ''
    secrets:
      release-token:
        description: 'PAT with contents:write from a repo admin — bypasses branch protection for the version-bump push'
        required: false
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key for git-iris release notes generation'
        required: false

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.release-token || secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        if: inputs.system-deps != ''
        env:
          SYSTEM_DEPS: ${{ inputs.system-deps }}
        run: |
          read -ra deps <<< "$SYSTEM_DEPS"
          sudo apt-get update
          sudo apt-get install -y "${deps[@]}"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest
        if: inputs.nextest
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-nextest

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          # Prefer latest git tag, fall back to Cargo.toml
          CURRENT_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$CURRENT_TAG" ]; then
            current="${CURRENT_TAG#v}"
          else
            current=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "📌 Current version: $current (from tag: ${CURRENT_TAG:-none})"

          if [ -n "$VERSION_INPUT" ]; then
            new="$VERSION_INPUT"
          else
            IFS='.' read -r major minor patch <<< "$current"
            case "$BUMP" in
              major) new="$((major + 1)).0.0" ;;
              minor) new="$major.$((minor + 1)).0" ;;
              patch) new="$major.$minor.$((patch + 1))" ;;
              *) echo "::error::Invalid bump type: $BUMP"; exit 1 ;;
            esac
          fi

          # Validate format
          if ! echo "$new" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: $new (expected: X.Y.Z)"
            exit 1
          fi

          # Check tag doesn't already exist
          if git tag -l "v$new" | grep -q "v$new"; then
            echo "::error::Tag v$new already exists"
            exit 1
          fi

          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "🏷️ Version: $current → $new"

      - name: Patch Cargo.toml version
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"${NEW_VERSION}\"/" Cargo.toml

      - name: Patch workspace crate versions
        if: inputs.workspace-crates != ''
        env:
          WORKSPACE_CRATES: ${{ inputs.workspace-crates }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          read -ra crates <<< "$WORKSPACE_CRATES"
          for crate in "${crates[@]}"; do
            crate_toml="$crate/Cargo.toml"
            if [ -f "$crate_toml" ]; then
              sed -i "0,/^version = \".*\"/s//version = \"${NEW_VERSION}\"/" "$crate_toml"
              echo "📦 Patched $crate_toml"
            fi
          done

      - name: Patch workspace dependency version pins
        if: inputs.patch-workspace-dep-versions
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          # Update version = "..." on lines that also contain path = "..." (workspace path deps)
          sed -i "/path = \"/s/version = \"[^\"]*\"/version = \"${NEW_VERSION}\"/" Cargo.toml
          echo "📦 Updated workspace dependency version pins"

      - name: Patch extra version files
        if: inputs.version-files != ''
        env:
          VERSION_FILES: ${{ inputs.version-files }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          echo "$VERSION_FILES" | while IFS= read -r entry; do
            # Skip empty lines
            [ -z "$entry" ] && continue

            # Split on | for optional jq path (default: .version)
            file="${entry%%|*}"
            jq_path="${entry#*|}"
            [ "$jq_path" = "$file" ] && jq_path=".version"

            # Trim whitespace
            file="$(echo "$file" | xargs)"
            jq_path="$(echo "$jq_path" | xargs)"

            if [ ! -f "$file" ]; then
              echo "::warning::Version file not found: $file"
              continue
            fi

            case "$file" in
              *.json)
                jq "$jq_path = \"$NEW_VERSION\"" "$file" > "$file.tmp" && mv "$file.tmp" "$file"
                echo "📦 Patched $file ($jq_path)"
                ;;
              *.md|*.yml|*.yaml)
                # Patch "version: X.Y.Z" or 'version: "X.Y.Z"' in YAML frontmatter
                sed -i "0,/^version:.*/s/^version:.*/version: \"$NEW_VERSION\"/" "$file"
                echo "📦 Patched $file (frontmatter)"
                ;;
              *)
                echo "::warning::Unsupported file type: $file"
                ;;
            esac
          done

      - name: Update lockfile
        run: cargo generate-lockfile

      - name: Build
        run: >-
          cargo build
          --locked
          ${{ inputs.workspace && '--workspace' || '' }}
          ${{ inputs.all-features && '--all-features' || '' }}

      - name: Run tests (nextest)
        if: inputs.nextest
        run: >-
          cargo nextest run
          --locked
          ${{ inputs.workspace && '--workspace' || '' }}
          ${{ inputs.all-features && '--all-features' || '' }}

      - name: Run tests (cargo test)
        if: ${{ !inputs.nextest }}
        run: >-
          cargo test
          --locked
          ${{ inputs.workspace && '--workspace' || '' }}
          ${{ inputs.all-features && '--all-features' || '' }}

      - name: Clippy
        run: >-
          cargo clippy
          --locked
          ${{ inputs.workspace && '--workspace' || '' }}
          ${{ inputs.all-features && '--all-features' || '' }}
          -- -D warnings

      - name: Commit version bump
        if: ${{ !inputs.dry_run }}
        env:
          WORKSPACE_CRATES: ${{ inputs.workspace-crates }}
          VERSION_FILES: ${{ inputs.version-files }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          git add Cargo.toml Cargo.lock
          if [ -n "$WORKSPACE_CRATES" ]; then
            read -ra crates <<< "$WORKSPACE_CRATES"
            for crate in "${crates[@]}"; do
              [ -f "$crate/Cargo.toml" ] && git add "$crate/Cargo.toml"
            done
          fi
          if [ -n "$VERSION_FILES" ]; then
            echo "$VERSION_FILES" | while IFS= read -r entry; do
              entry="$(echo "$entry" | xargs)"
              [ -z "$entry" ] && continue
              file="${entry%%|*}"
              [ -n "$file" ] && [ -f "$file" ] && git add "$file"
            done || true
          fi
          git commit -m "release: v${NEW_VERSION}"

      - name: Create and push tag
        if: ${{ !inputs.dry_run }}
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin "HEAD:${BRANCH}"
          git push origin "v${NEW_VERSION}"

      - name: Generate release notes
        if: ${{ !inputs.dry_run && inputs.generate-release-notes }}
        uses: hyperb1iss/git-iris@v2
        with:
          provider: ${{ inputs.release-notes-provider }}
          model: ${{ inputs.release-notes-model }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload release notes artifact
        if: ${{ !inputs.dry_run && inputs.generate-release-notes }}
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release_notes.md

      - name: Generate changelog
        if: ${{ !inputs.dry_run && inputs.generate-changelog }}
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
          RELEASE_NOTES_MODEL: ${{ inputs.release-notes-model }}
          RELEASE_NOTES_PROVIDER: ${{ inputs.release-notes-provider }}
        run: |
          cargo install git-iris || true
          git-iris changelog --provider "$RELEASE_NOTES_PROVIDER" --model "$RELEASE_NOTES_MODEL"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for v${NEW_VERSION}"
          git push origin HEAD

      - name: Trigger downstream workflow
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CICD_WORKFLOW: ${{ inputs.cicd-workflow }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
          PASS_RUN_ID: ${{ inputs.pass-run-id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          args=(--ref "v${NEW_VERSION}")
          if [ "$PASS_RUN_ID" = "true" ]; then
            args+=(-f "release_run_id=${RUN_ID}")
          fi
          gh workflow run "$CICD_WORKFLOW" "${args[@]}"

      - name: Summary
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CICD_WORKFLOW: ${{ inputs.cicd-workflow }}
          CURRENT_VERSION: ${{ steps.version.outputs.current }}
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Release [DRY RUN] v${NEW_VERSION}"
              echo ""
              echo "Build and tests passed. Run again without dry-run to publish."
            else
              echo "## Release v${NEW_VERSION}"
              echo ""
              echo "Version bumped: ${CURRENT_VERSION} → ${NEW_VERSION}"
              echo "Tag pushed: v${NEW_VERSION}"
              echo "Downstream workflow triggered: ${CICD_WORKFLOW}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
