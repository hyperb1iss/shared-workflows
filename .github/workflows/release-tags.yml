# Only the CI workflow calls this job after validating the same commit.
name: Release Tags

on:
  workflow_call:

permissions:
  contents: write

jobs:
  update-major-tag:
    if: github.repository == 'hyperb1iss/shared-workflows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Promote validated commit
        env:
          MAJOR_TAG: v2
        run: bash scripts/promote-tag.sh
