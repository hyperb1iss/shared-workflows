# 📦 npm Publish — shared-workflows
# Build with Bun and publish to npm through trusted publishing (OIDC).

name: npm Publish

on:
  workflow_call:
    inputs:
      bun-version:
        description: 'Bun version to install'
        type: string
        default: '1.3.14'
      package-dirs:
        description: 'Newline-separated package directories in publish order'
        type: string
        default: '.'
      checkout-ref:
        description: 'Git ref to checkout (empty = caller ref)'
        type: string
        default: ''
      check-script:
        description: 'Root package script that runs release verification'
        type: string
        default: 'check'
      build-script:
        description: 'Root package script that builds publishable packages'
        type: string
        default: 'build'
      tag:
        description: 'npm distribution tag'
        type: string
        default: 'latest'
      dry-run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: bun ci

      - name: Check
        env:
          SCRIPT: ${{ inputs.check-script }}
        run: bun run "$SCRIPT"

      - name: Build
        env:
          SCRIPT: ${{ inputs.build-script }}
        run: bun run "$SCRIPT"

      - name: Publish packages
        env:
          PACKAGE_DIRS: ${{ inputs.package-dirs }}
          NPM_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          while IFS= read -r package_dir; do
            [ -z "$package_dir" ] && continue
            if [ "$DRY_RUN" = 'true' ]; then
              npm publish "./$package_dir" --access public --tag "$NPM_TAG" --dry-run
            else
              npm publish "./$package_dir" --access public --tag "$NPM_TAG"
            fi
          done <<< "$PACKAGE_DIRS"
