# 🔨 Rust Build Artifacts — shared-workflows
# Cross-platform binary builds with optional .deb/.rpm packaging.

name: Rust Build Artifacts

on:
  workflow_call:
    inputs:
      binaries:
        description: "Space-separated binary names to extract (e.g., 'unifly unifly-tui')"
        type: string
        required: true
      system-deps:
        description: 'Linux-only apt packages'
        type: string
        default: ''
      targets:
        description: 'Space-separated target list'
        type: string
        default: 'linux-amd64 linux-arm64 macos-arm64 windows-gnu'
      build-packages:
        description: 'Build .deb + .rpm packages'
        type: boolean
        default: false
      cargo-build-args:
        description: 'Extra cargo build arguments'
        type: string
        default: '--locked'
      cargo-profile:
        description: 'Cargo profile used for both build and artifact extraction'
        type: string
        default: 'release'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Target Selection ──────────────────────────────────────────────
  # The matrix context is not available in a job-level `if:`, so the
  # requested targets are resolved here and the build matrix is
  # constructed from the result.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select build targets
        id: select
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          cat > all-targets.json <<'JSON'
          [
            { "target": "linux-amd64", "os": "ubuntu-latest",    "rust-target": "x86_64-unknown-linux-gnu",  "suffix": "" },
            { "target": "linux-arm64", "os": "ubuntu-24.04-arm", "rust-target": "aarch64-unknown-linux-gnu", "suffix": "" },
            { "target": "macos-arm64", "os": "macos-latest",     "rust-target": "aarch64-apple-darwin",      "suffix": "" },
            { "target": "windows-gnu", "os": "windows-latest",   "rust-target": "x86_64-pc-windows-gnu",     "suffix": ".exe" }
          ]
          JSON

          read -ra requested <<< "$TARGETS"
          if [ "${#requested[@]}" -eq 0 ]; then
            echo "::error::At least one build target is required."
            exit 1
          fi
          for target in "${requested[@]}"; do
            if ! jq -e --arg target "$target" 'any(.[]; .target == $target)' all-targets.json > /dev/null; then
              echo "::error::Unknown build target: $target"
              exit 1
            fi
          done
          selected=$(jq -c --argjson requested "$(printf '%s\n' "${requested[@]}" | jq -R . | jq -s .)" \
            '[.[] | select(.target as $target | $requested | index($target))]' all-targets.json)

          jq -r '.[] | "🎯 \(.target) → \(.["rust-target"]) on \(.os)"' <<< "$selected"
          echo "matrix={\"include\":$selected}" >> "$GITHUB_OUTPUT"

  # ── Build Matrix ──────────────────────────────────────────────────
  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: inputs.system-deps != '' && runner.os == 'Linux'
        env:
          SYSTEM_DEPS: ${{ inputs.system-deps }}
        run: |
          read -ra deps <<< "$SYSTEM_DEPS"
          sudo apt-get update
          sudo apt-get install -y "${deps[@]}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build
        env:
          CARGO_PROFILE: ${{ inputs.cargo-profile }}
          BUILD_ARGS: ${{ inputs.cargo-build-args }}
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          read -ra args <<< "$BUILD_ARGS"
          for arg in "${args[@]}"; do
            case "$arg" in
              --release|--profile|--profile=*|--target|--target=*|--target-dir|--target-dir=*)
                echo "::error::Use cargo-profile and targets inputs instead of build argument $arg"
                exit 1 ;;
            esac
          done
          cargo build "${args[@]}" --profile "$CARGO_PROFILE" --target "$RUST_TARGET"

      - name: Stage binaries
        env:
          BINARIES: ${{ inputs.binaries }}
          RUST_TARGET: ${{ matrix.rust-target }}
          CARGO_PROFILE: ${{ inputs.cargo-profile }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p staging
          profile_dir="$CARGO_PROFILE"
          case "$profile_dir" in
            dev|test) profile_dir=debug ;;
            release|bench) profile_dir=release ;;
          esac
          read -ra names <<< "$BINARIES"
          for binary in "${names[@]}"; do
            cp "target/${RUST_TARGET}/${profile_dir}/${binary}${SUFFIX}" staging/
            echo "📦 Staged ${binary}${SUFFIX}"
          done

      - name: Archive binaries
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: tar -czf "binaries-${BUILD_TARGET}.tar.gz" -C staging .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: binaries-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # ── Linux Packages (.deb + .rpm) ─────────────────────────────────
  packages:
    if: inputs.build-packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: inputs.system-deps != ''
        env:
          SYSTEM_DEPS: ${{ inputs.system-deps }}
        run: |
          read -ra deps <<< "$SYSTEM_DEPS"
          sudo apt-get update
          sudo apt-get install -y "${deps[@]}"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build .deb package
        run: cargo deb

      - name: Build .rpm package
        run: cargo generate-rpm

      - name: Generate man page
        env:
          BINARIES: ${{ inputs.binaries }}
        run: |
          mkdir -p staging
          read -ra names <<< "$BINARIES"
          for binary in "${names[@]}"; do
            if [ -f "target/release/man/${binary}.1" ]; then
              cp "target/release/man/${binary}.1" staging/
            fi
          done

      - name: Stage packages
        run: |
          mkdir -p staging
          cp target/debian/*.deb staging/
          cp target/generate-rpm/*.rpm staging/
          ls -la staging/

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: staging/
          if-no-files-found: error
