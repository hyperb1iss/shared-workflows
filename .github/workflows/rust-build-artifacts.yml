# 🔨 Rust Build Artifacts — shared-workflows
# Cross-platform binary builds with optional .deb/.rpm packaging.

name: Rust Build Artifacts

on:
  workflow_call:
    inputs:
      binaries:
        description: "Space-separated binary names to extract (e.g., 'unifly unifly-tui')"
        type: string
        required: true
      system-deps:
        description: 'Linux-only apt packages'
        type: string
        default: ''
      targets:
        description: 'Space-separated target list'
        type: string
        default: 'linux-amd64 linux-arm64 macos-arm64 windows-gnu'
      build-packages:
        description: 'Build .deb + .rpm packages'
        type: boolean
        default: false
      cargo-build-args:
        description: 'Extra cargo build arguments'
        type: string
        default: '--release --locked'

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Target Selection ──────────────────────────────────────────────
  # The matrix context is not available in a job-level `if:`, so the
  # requested targets are resolved here and the build matrix is
  # constructed from the result.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select build targets
        id: select
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          cat > all-targets.json <<'JSON'
          [
            { "target": "linux-amd64", "os": "ubuntu-latest",    "rust-target": "x86_64-unknown-linux-gnu",  "suffix": "" },
            { "target": "linux-arm64", "os": "ubuntu-24.04-arm", "rust-target": "aarch64-unknown-linux-gnu", "suffix": "" },
            { "target": "macos-arm64", "os": "macos-latest",     "rust-target": "aarch64-apple-darwin",      "suffix": "" },
            { "target": "windows-gnu", "os": "windows-latest",   "rust-target": "x86_64-pc-windows-gnu",     "suffix": ".exe" }
          ]
          JSON

          selected=$(jq -c --arg t " $TARGETS " \
            '[.[] | . as $e | select($t | contains(" " + $e.target + " "))]' all-targets.json)

          if [ "$(jq 'length' <<< "$selected")" -eq 0 ]; then
            echo "::error::No known build targets matched '$TARGETS'."
            echo "::error::Valid targets: $(jq -r '[.[].target] | join(" ")' all-targets.json)"
            exit 1
          fi

          jq -r '.[] | "🎯 \(.target) → \(.["rust-target"]) on \(.os)"' <<< "$selected"
          echo "matrix={\"include\":$selected}" >> "$GITHUB_OUTPUT"

  # ── Build Matrix ──────────────────────────────────────────────────
  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: inputs.system-deps != '' && runner.os == 'Linux'
        env:
          SYSTEM_DEPS: ${{ inputs.system-deps }}
        run: |
          read -ra deps <<< "$SYSTEM_DEPS"
          sudo apt-get update
          sudo apt-get install -y "${deps[@]}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          BUILD_ARGS: ${{ inputs.cargo-build-args }}
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          read -ra args <<< "$BUILD_ARGS"
          cargo build "${args[@]}" --target "$RUST_TARGET"

      - name: Stage binaries
        env:
          BINARIES: ${{ inputs.binaries }}
          RUST_TARGET: ${{ matrix.rust-target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p staging
          read -ra names <<< "$BINARIES"
          for binary in "${names[@]}"; do
            cp "target/${RUST_TARGET}/release/${binary}${SUFFIX}" staging/
            echo "📦 Staged ${binary}${SUFFIX}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: staging/
          if-no-files-found: error

  # ── Linux Packages (.deb + .rpm) ─────────────────────────────────
  packages:
    if: inputs.build-packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: inputs.system-deps != ''
        env:
          SYSTEM_DEPS: ${{ inputs.system-deps }}
        run: |
          read -ra deps <<< "$SYSTEM_DEPS"
          sudo apt-get update
          sudo apt-get install -y "${deps[@]}"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Build .deb package
        run: cargo deb

      - name: Build .rpm package
        run: cargo generate-rpm

      - name: Generate man page
        env:
          BINARIES: ${{ inputs.binaries }}
        run: |
          mkdir -p staging
          read -ra names <<< "$BINARIES"
          for binary in "${names[@]}"; do
            if [ -f "target/release/man/${binary}.1" ]; then
              cp "target/release/man/${binary}.1" staging/
            fi
          done

      - name: Stage packages
        run: |
          mkdir -p staging
          cp target/debian/*.deb staging/ 2>/dev/null || true
          cp target/generate-rpm/*.rpm staging/ 2>/dev/null || true
          ls -la staging/

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: staging/
          if-no-files-found: warn
