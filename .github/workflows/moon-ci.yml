# 🌙 Moon CI — shared-workflows
# Polyglot moonrepo workspace CI (Node + Python).

name: Moon CI

on:
  workflow_call:
    inputs:
      system-deps:
        description: 'apt packages to install'
        type: string
        default: ''
      uv-sync:
        description: 'Run uv sync before tasks'
        type: boolean
        default: false
      uv-sync-args:
        description: 'Extra uv sync args (e.g., --all-extras)'
        type: string
        default: ''
      env-vars:
        description: 'KEY=VALUE lines injected into GITHUB_ENV'
        type: string
        default: ''
      moon-commands:
        description: 'Newline-separated moon commands (preferred over moon-tasks)'
        type: string
        default: ''
      moon-tasks:
        description: 'Space-separated tasks passed to moon ci (backward compat)'
        type: string
        default: 'check'
      node-version:
        description: 'Node.js version'
        type: string
        default: '24'
      python-version:
        description: 'Python version'
        type: string
        default: '3.13'
      pnpm-version:
        description: 'pnpm version (empty = project pin, falling back to 10)'
        type: string
        default: ''

permissions:
  contents: read

env:
  UV_PYTHON: ${{ inputs.python-version }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        if: inputs.system-deps != ''
        env:
          SYSTEM_DEPS: ${{ inputs.system-deps }}
        run: |
          read -ra deps <<< "$SYSTEM_DEPS"
          sudo apt-get update
          sudo apt-get install -y "${deps[@]}"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Resolve pnpm version
        id: pnpm-version
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
          PACKAGE_JSON: package.json
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.env.PACKAGE_JSON, 'utf8'));
          const pinned = manifest.packageManager?.startsWith('pnpm@') ||
            manifest.devEngines?.packageManager?.name === 'pnpm';
          const version = process.env.PNPM_VERSION || (pinned ? '' : '10');
          if (/[\r\n]/.test(version)) throw new Error('Invalid pnpm version');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\n');
          JS

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          package_json_file: package.json

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Setup moon
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      # Proto would otherwise shadow the native setup-* installs above.
      - name: Remove proto shims
        run: rm -f "$HOME/.proto/shims"/{node,pnpm,uv,python}*

      - name: Restore moon cache
        id: moon-cache
        uses: actions/cache/restore@v6
        with:
          path: .moon/cache
          key: moon-${{ runner.os }}-${{ hashFiles('.prototools', 'uv.lock', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            moon-${{ runner.os }}-${{ hashFiles('.prototools', 'uv.lock', 'pnpm-lock.yaml') }}-
            moon-${{ runner.os }}-

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Save pnpm cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Install Python dependencies
        if: inputs.uv-sync
        env:
          UV_SYNC_ARGS: ${{ inputs.uv-sync-args }}
        run: |
          read -ra args <<< "$UV_SYNC_ARGS"
          uv sync --locked "${args[@]}"

      - name: Inject environment variables
        if: inputs.env-vars != ''
        env:
          ENV_VARS: ${{ inputs.env-vars }}
        run: |
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$ENV_VARS"

      - name: Run moon commands
        if: inputs.moon-commands != ''
        env:
          MOON_COMMANDS: ${{ inputs.moon-commands }}
        run: |
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            if [[ ! "$cmd" =~ ^moon[[:space:]] ]]; then
              echo "::error::Command must start with 'moon': $cmd"
              exit 1
            fi
            echo "▸ $cmd"
            bash -e -o pipefail -c "$cmd"
          done <<< "$MOON_COMMANDS"

      - name: Run moon ci
        if: inputs.moon-commands == ''
        env:
          MOON_TASKS: ${{ inputs.moon-tasks }}
        run: |
          read -ra tasks <<< "$MOON_TASKS"
          moon ci "${tasks[@]}"

      - name: Save moon cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .moon/cache
          key: ${{ steps.moon-cache.outputs.cache-primary-key }}
