# 🦀 Rust CI — shared-workflows
# Lint, test, and audit for Rust projects.
# Replaces 60-100 lines of duplicated CI YAML with ~15 in each consumer.

name: Rust CI

on:
  workflow_call:
    inputs:
      change-detection:
        description: 'Enable dorny/paths-filter gating'
        type: boolean
        default: true
      change-filters:
        description: 'Extra path filters (YAML, appended to defaults)'
        type: string
        default: ''
      system-deps:
        description: "apt packages to install (e.g., 'libdbus-1-dev pkg-config lld')"
        type: string
        default: ''
      workspace:
        description: 'Use --workspace flag on cargo commands'
        type: boolean
        default: false
      all-features:
        description: 'Use --all-features flag'
        type: boolean
        default: true
      all-targets:
        description: 'Use --all-targets for clippy'
        type: boolean
        default: true
      nextest:
        description: 'Use cargo-nextest (falls back to cargo test if false)'
        type: boolean
        default: true
      cargo-deny:
        description: 'Run cargo-deny audit'
        type: boolean
        default: true
      nightly-fmt:
        description: 'Use nightly toolchain for rustfmt'
        type: boolean
        default: false
      extra-clippy-args:
        description: 'Additional clippy arguments'
        type: string
        default: ''
      rust-toolchain:
        description: 'Rust toolchain version'
        type: string
        default: 'stable'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_WORKSPACE: ${{ inputs.workspace }}
  CARGO_ALL_FEATURES: ${{ inputs.all-features }}
  RUSTUP_TOOLCHAIN: ${{ inputs.rust-toolchain }}

jobs:
  # ── Change Detection ──────────────────────────────────────────────
  changes:
    if: inputs.change-detection
    runs-on: ubuntu-latest
    # Job-level permissions replace the default outright, so contents
    # has to be restated here or checkout loses read access.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.changes != '[]' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '.cargo/**'
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'benches/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'rust-toolchain.toml'
            ci:
              - '.github/workflows/**'
              - 'justfile'
              - 'Makefile'
            ${{ inputs.change-filters }}

  # ── Check (fmt + clippy) ──────────────────────────────────────────
  check:
    needs: changes
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.src == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: inputs.system-deps != ''
        env:
          SYSTEM_DEPS: ${{ inputs.system-deps }}
        run: |
          read -ra deps <<< "$SYSTEM_DEPS"
          sudo apt-get update
          sudo apt-get install -y "${deps[@]}"

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: clippy, rustfmt

      - name: Setup Rust (nightly fmt)
        if: inputs.nightly-fmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Check formatting
        env:
          FORMAT_TOOLCHAIN: ${{ inputs.nightly-fmt && 'nightly' || inputs.rust-toolchain }}
        run: cargo "+$FORMAT_TOOLCHAIN" fmt --all --check

      - name: Clippy
        env:
          RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
          CARGO_ALL_TARGETS: ${{ inputs.all-targets }}
          EXTRA_CLIPPY_ARGS: ${{ inputs.extra-clippy-args }}
        run: |
          read -ra extra <<< "$EXTRA_CLIPPY_ARGS"
          args=(--locked)
          if [ "$CARGO_WORKSPACE" = true ]; then args+=(--workspace); fi
          if [ "$CARGO_ALL_TARGETS" = true ]; then args+=(--all-targets); fi
          if [ "$CARGO_ALL_FEATURES" = true ]; then args+=(--all-features); fi
          cargo "+$RUST_TOOLCHAIN" clippy "${args[@]}" "${extra[@]}" -- -D warnings

  # ── Test ──────────────────────────────────────────────────────────
  test:
    needs: changes
    if: |
      always() &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.src == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: inputs.system-deps != ''
        env:
          SYSTEM_DEPS: ${{ inputs.system-deps }}
        run: |
          read -ra deps <<< "$SYSTEM_DEPS"
          sudo apt-get update
          sudo apt-get install -y "${deps[@]}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install nextest
        if: inputs.nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests (nextest)
        if: inputs.nextest
        run: |
          args=(--locked)
          if [ "$CARGO_WORKSPACE" = true ]; then args+=(--workspace); fi
          if [ "$CARGO_ALL_FEATURES" = true ]; then args+=(--all-features); fi
          cargo nextest run "${args[@]}"

      - name: Run tests (cargo test)
        if: ${{ !inputs.nextest }}
        run: |
          args=(--locked)
          if [ "$CARGO_WORKSPACE" = true ]; then args+=(--workspace); fi
          if [ "$CARGO_ALL_FEATURES" = true ]; then args+=(--all-features); fi
          cargo test "${args[@]}"

      - name: Run doc tests
        if: inputs.nextest
        run: |
          args=(--locked)
          if [ "$CARGO_WORKSPACE" = true ]; then args+=(--workspace); fi
          if [ "$CARGO_ALL_FEATURES" = true ]; then args+=(--all-features); fi
          cargo test --doc "${args[@]}"

  # ── Cargo Deny ────────────────────────────────────────────────────
  deny:
    needs: changes
    if: |
      always() &&
      inputs.cargo-deny &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.src == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
