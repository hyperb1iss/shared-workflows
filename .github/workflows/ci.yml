name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - name: Validate Actions schema and shell scripts
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12 -color
          shellcheck scripts/*.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: uv sync --locked
      - run: uv run --locked ruff check tests
      - run: uv run --locked ruff format --check tests
      - run: uv run --locked ty check tests
      - run: uv run --locked pytest

  smoke:
    uses: ./.github/workflows/bun-ci.yml
    with:
      working-directory: tests/fixtures/bun

  promote:
    needs: [lint, test, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release-tags.yml
