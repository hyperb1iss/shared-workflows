name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
          enable-cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: actionlint@1.7.12
      - name: Validate Actions schema and shell scripts
        run: |
          uv run --locked python scripts/lint_workflows.py
          shellcheck scripts/*.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: uv sync --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: actionlint@1.7.12
      - run: uv run --locked ruff check scripts tests
      - run: uv run --locked ruff format --check scripts tests
      - run: uv run --locked ty check scripts tests
      - run: uv run --locked pytest

  smoke:
    uses: ./.github/workflows/bun-ci.yml
    with:
      working-directory: tests/fixtures/bun

  python-smoke:
    uses: ./.github/workflows/python-build.yml
    with:
      package-dir: tests/fixtures/python

  verify-python-smoke:
    needs: python-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.python-smoke.outputs.artifact-name }}
          path: dists/
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Install the built wheel without source checkout
        run: |
          uv venv
          uv pip install --python .venv/bin/python --no-index dists/*.whl
          test "$(.venv/bin/workflow-fixture)" = 'Installed the shared workflow distribution'

  promote:
    needs: [lint, test, smoke, python-smoke, verify-python-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release-tags.yml
