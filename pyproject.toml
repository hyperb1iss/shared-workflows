[project]
name = "shared-workflows-tests"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6", "tomlkit>=0.13", "ruff>=0.12", "ty>=0.0.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
